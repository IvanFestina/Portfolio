<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ivan Andreev — React Native Engineer with mobile technical leadership experience. 5+ years of production B2B mobile apps: enterprise CRM, retail order picking. Tbilisi, Georgia, open to relocation."
    />
    <meta property="og:title" content="Ivan Andreev - React Native Engineer" />
    <meta
      property="og:description"
      content="5+ years of production B2B mobile apps: enterprise CRM (~5.2K MAU), retail order picking (200+ stores). React Native New Architecture, TypeScript and mobile releases. Tbilisi, Georgia."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ivanfestina.github.io/Portfolio/" />
    <meta property="og:image" content="https://ivanfestina.github.io/Portfolio/og.jpg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f151e" />
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') ??
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
    <link rel="preload" href="/fonts/IBMPlexSans-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexMono-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>Ivan Andreev - React Native Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
