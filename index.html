<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ivan Andreev — React Native Developer (React · TypeScript), expanding into DevOps. 5+ years of production B2B mobile apps: enterprise CRM, retail order picking. Saint Petersburg, open to relocation."
    />
    <meta property="og:title" content="Ivan Andreev — React Native Developer" />
    <meta
      property="og:description"
      content="5+ years of production B2B mobile apps: enterprise CRM (~5.2K MAU), retail order picking (200+ stores). React · TypeScript, expanding into DevOps."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ivanfestina.github.io/Portfolio/" />
    <meta property="og:image" content="https://ivanfestina.github.io/Portfolio/og.jpg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f151e" />
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') ??
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <title>Ivan Andreev — React Native Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
